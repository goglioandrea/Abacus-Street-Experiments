        // (P2_START), running concurrently with P2–P4 rather than after them.
        P5_START: 2000, P5_NAME_FADE: 100, P5_STAGGER: 100, P5_GROW: 500,
        // Phase 5 length depends on the feature count N: names appear one at a
        // time (P5_STAGGER apart, each fading over P5_NAME_FADE); when a name
        // finishes, its line grows over P5_GROW. The last line finishes at
        // (N-1)*STAGGER + NAME_FADE + GROW after P5_START. introSetP5End(N)
        // stores that so P6 can follow. Defaults to a 1-feature span until set.
        _p5EndOffset: 100 + 500,
        get P5_END() { return this.P5_START + this._p5EndOffset; },
        // P6 (the remaining fills) only starts once BOTH the legend levels (P4)
        // and the feature name/line pipeline (P5) have finished.
        get P6_START() { return Math.max(this.P4_END, this.P5_END); },
        P6_DUR: 500,
        get P6_END() { return this.P6_START + this.P6_DUR; },
        UNDERSCORE_MS: 250,
    };
    // Recompute the P5 span from the actual feature count (called at intro start).
    function introSetP5End(n) {
        const last = Math.max(0, n - 1);
        INTRO._p5EndOffset = last * INTRO.P5_STAGGER + INTRO.P5_NAME_FADE + INTRO.P5_GROW;
    }
    const introState = { active: false, startTime: 0, frameId: null, buttonsFading: false };

    function introActive() { return introState.active; }

    // Flat, stable ordering of features for the P5 stagger: category order
    // (materials, semiProcessed, furniture) then index within each.
    function introFeatureList(g) {
        const list = [];
        for (const cat of FEATURE_CATEGORIES) {
            const arr = cat.arr();
            for (let i = 0; i < arr.length; i++) list.push({ type: cat.type, index: i });
        }
        return list;
    }

    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

    function setTitleForIntro(elapsed) {
        const el = document.getElementById('abacusTitle');
        if (!el) return;
        const full = INTRO.titleText;
        const n = full.length;
        // Reveal all letters across the first 80% of P1 so the completed word
        // sits with a blinking cursor for the final stretch (rather than the last
        // letter landing exactly at the phase boundary). One letter per slice.
        const typeWindow = INTRO.P1_END * 0.8;
        const shown = Math.min(n, Math.floor((elapsed / typeWindow) * n) + (elapsed > 0 ? 1 : 0));
        const shownClamped = Math.max(0, Math.min(n, shown));
        const typing = elapsed < INTRO.P1_END;
        // Blinking cursor: visible for the first half of each UNDERSCORE_MS
        // window, hidden for the second. Hidden = empty string (a clean blink);
        // the tiny width change is imperceptible for a 1-char cursor.
        const blinkOn = Math.floor(elapsed / INTRO.UNDERSCORE_MS) % 2 === 0;
        const cursor = typing ? (blinkOn ? '_' : '') : '';
        el.textContent = full.slice(0, shownClamped) + cursor;
    }

    function finishIntroTitle() {
        const el = document.getElementById('abacusTitle');
        if (el) el.textContent = INTRO.titleText;
    }

    function introFrame(now) {
        // Anchor the clock to the first frame's timestamp so elapsed starts at 0
        // regardless of any skew between performance.now() and rAF timestamps.
        if (introState.startTime === 0) introState.startTime = now;
        const elapsed = now - introState.startTime;
        const g = geometry();
        const levelCols = computeLevelColumns(g.textAnchorX);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1d1d1b';
        ctx.strokeStyle = '#1d1d1b';
        ctx.lineWidth = lineWidth;
        ctx.font = '12px Helvetica, Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        textElements.length = 0;

        // Title (typed).
        setTitleForIntro(elapsed);

        // P6 fade fraction (category zones, inner arcs, crossing beads). Zones
        // are the BACKGROUND, so they must be painted FIRST every frame — drawing
        // them last (as before) made them briefly cover the lines/text before the
        // final drawGrid() put them back, an ugly pop. Inner arcs + crossing beads
        // are foreground and drawn later in the frame at the same alpha.
        const p6 = easeInOutQuad(clamp01((elapsed - INTRO.P6_START) / INTRO.P6_DUR));
        if (p6 > 0) drawCategoryZones(g, p6);

        // P4: legend levels fade. Computed early because the legend line style
        // (solid vs interrupted) depends on whether levels have started to appear.
        const p4 = easeInOutQuad(clamp01((elapsed - INTRO.P4_START) / (INTRO.P4_END - INTRO.P4_START)));

        // P2: legend names + connectors + groups (line always interrupted at the
        // level columns). The gaps are filled by a separate layer that fades out
        // as the levels fade in (below), so the line smoothly "opens up".
        const p2 = easeInOutQuad(clamp01((elapsed - INTRO.P2_START) / (INTRO.P2_END - INTRO.P2_START)));
        if (p2 > 0) drawLegendNamesAndConnectors(g, levelCols, p2);

        // Level-gap fill: solid before levels appear, fading out over P4 as the
        // level beads/labels fade in.
        if (p2 > 0 && p4 < 1) drawLegendLevelGaps(g, levelCols, p2 * (1 - p4));

        // P3: ring-arc sweep (linear).
        const p3 = clamp01((elapsed - INTRO.P3_START) / (INTRO.P3_END - INTRO.P3_START));
        if (p3 > 0) drawPropertyRings(g, 1, p3);

        // P4 draw: legend level beads + labels.
        if (p4 > 0) drawLegendLevels(g, levelCols, p4);

        // P5: feature names appear one at a time (P5_STAGGER apart, each fading
        // over P5_NAME_FADE), concurrently with the legend. The instant a name
        // finishes fading, its line grows over P5_GROW. Name i+1 begins exactly
        // when name i's fade ends.
        if (elapsed >= INTRO.P5_START) {
            const feats = introFeatureList(g);
            const n = feats.length;
            const rel = elapsed - INTRO.P5_START;
            for (let k = 0; k < n; k++) {
                const f = feats[k];
                const nameStart = k * INTRO.P5_STAGGER;
                const sinceName = rel - nameStart;
                if (sinceName <= 0) continue;
                const only = (t, i) => (t === f.type && i === f.index);
                // Name fade over P5_NAME_FADE.
                const nameFade = easeInOutQuad(clamp01(sinceName / INTRO.P5_NAME_FADE));
                if (nameFade > 0) drawFeatureNames(g, nameFade, only, true);
                // Line grows only after the name has fully appeared.
                const sinceGrow = sinceName - INTRO.P5_NAME_FADE;
                if (sinceGrow > 0) {
                    const grow = clamp01(sinceGrow / INTRO.P5_GROW);
                    drawFeatureLines(g, 1, grow, only);
                }
            }
        }

        // Inner category arcs sweep clockwise across the whole angular span,
        // synced with the feature name/line pipeline (same P5 window). Drawn full
        // strength (they're structural lines, not a fade). Once P5 is done they're
        // complete; P6 no longer needs to redraw them.
        const arcSweep = clamp01((elapsed - INTRO.P5_START) / (INTRO.P5_END - INTRO.P5_START));
        if (arcSweep > 0) drawInnerArcs(g, 1, arcSweep);

        // P6 foreground: crossing beads (zones drawn at top of frame; inner arcs
        // already swept in during P5).
        if (p6 > 0) {
            drawCrossingBeads(g, p6);
        }

        // Fade the DOM buttons in during the final phase (P6).
        if (p6 > 0 && !introState.buttonsFading) {
            introState.buttonsFading = true;
            introShowButtonsFading();
        }

        if (elapsed >= INTRO.P6_END) {
            endIntro();
            return;
        }
        introState.frameId = requestAnimationFrame(introFrame);
    }

    function endIntro() {
        introState.active = false;
        introState.frameId = null;
        introState.buttonsFading = false;
        finishIntroTitle();
        drawGrid();            // final, authoritative frame
        // Clear the intro fade classes and show everything at full opacity.
        introClearButtonFadeClasses();
        positionUIElements();  // reveal add-buttons + reset now that intro is done
    }

    function startIntro() {
        // Reduced motion: skip to final state.
        let reduce = false;
        try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
        catch (e) { reduce = false; }
        if (reduce) {
            introState.active = false;
            introState.buttonsFading = false;
            finishIntroTitle();
            drawGrid();
            introClearButtonFadeClasses();
            positionUIElements();
            return;
        }
        if (introState.frameId !== null) cancelAnimationFrame(introState.frameId);
        // Size phase 5 to the actual feature count so P6 follows correctly.
        introSetP5End(introFeatureList(geometry()).length);
        introState.active = true;
        introState.startTime = 0;   // anchored on the first introFrame timestamp
        introState.buttonsFading = false;
        // Hide all DOM UI (including the reset button) — everything fades in
        // together during the final phase.
        introHideUI();
        // Blank the canvas immediately (title starts empty).
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const el = document.getElementById('abacusTitle');
        if (el) el.textContent = '';
        introState.frameId = requestAnimationFrame(introFrame);
    }

    // IDs of the DOM buttons that fade in at the end of the intro.
    const INTRO_FADE_BUTTON_IDS = ['addSector1', 'addSector2', 'addSector3', 'addProperty', 'abacusResetBtn'];

    // Position the buttons (so they sit correctly) but start them transparent,
    // then on the next frame add the fade-in class so they transition to opaque
    // over the final phase.
    function introShowButtonsFading() {
        positionUIElements.__introFade = true;   // tell positioner to keep them transparent
        positionUIElements();
        positionUIElements.__introFade = false;
        // Force reflow so the opacity:0 state is committed before the transition.
        const first = document.getElementById(INTRO_FADE_BUTTON_IDS[0]);
        if (first) void first.offsetWidth;
        for (const id of INTRO_FADE_BUTTON_IDS) {
            const el = document.getElementById(id);
            if (el) { el.classList.remove('intro-hidden'); el.classList.add('intro-fade-in'); }
        }
    }

    function introClearButtonFadeClasses() {
        for (const id of INTRO_FADE_BUTTON_IDS) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('intro-hidden', 'intro-fade-in');
        }
    }

    // Hide add-buttons + inputs + reset button during the intro (all fade in at
    // the end together).
    function introHideUI() {
        ['addSector1', 'addSector2', 'addSector3', 'addProperty',
         'inputSector1', 'inputSector2', 'inputSector3', 'inputProperty',
         'abacusResetBtn', 'propertyActions', 'featureActions'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        });
    }

    // =====================================================================
    // UI POSITIONING (add buttons + inputs)
    // =====================================================================
    function positionUIElements() {
        // During the intro the add-buttons, inputs and reset button stay hidden —
        // EXCEPT when introShowButtonsFading() calls us in fade mode, where we
        // position + show them but start them transparent (opacity 0) so the
        // caller can transition them to opaque.
        const introFade = !!positionUIElements.__introFade;
        if (introState.active && !introFade) { introHideUI(); return; }
        const g = geometry();
        // In fade mode, add the intro-hidden (opacity:0) class to the buttons
        // that will fade; the caller swaps it for intro-fade-in.
        const markFade = (el) => { if (introFade && el) el.classList.add('intro-hidden'); };

        // Each category's "+" sits just inside its last feature line.
        const cats = [
            { addId: 'addSector1', inId: 'inputSector1', radius: g.veryInnerR - buttonMargin,      endAngle: g.sector1EndAngle },
            { addId: 'addSector2', inId: 'inputSector2', radius: g.innerCircle2R - buttonMargin,    endAngle: g.sector2EndAngle },
            { addId: 'addSector3', inId: 'inputSector3', radius: g.innerCircle1R - buttonMargin,    endAngle: g.sector3EndAngle },
        ];
        for (const c of cats) {
            const x = centerX + c.radius * Math.cos(c.endAngle);
            const y = centerY + c.radius * Math.sin(c.endAngle);
            const addEl = document.getElementById(c.addId);
            addEl.style.left = `${x}px`;
            addEl.style.top = `${y}px`;
            addEl.style.display = 'block';
            markFade(addEl);
            const inEl = document.getElementById(c.inId);
            inEl.style.left = `${x + 15}px`;
            inEl.style.top = `${y}px`;
        }

        // Property "+" at the next ring out; X anchored to the default border.
        const propertyRadius = innerRadius + properties.length * circleSpacing;
        const propertyButtonY = centerY - propertyRadius;
        const propertyButtonX = g.textAnchorX + textPadding;
        const addProp = document.getElementById('addProperty');
        addProp.style.left = `${propertyButtonX}px`;
        addProp.style.top = `${propertyButtonY}px`;
        addProp.style.display = 'block';
        markFade(addProp);
        const inProp = document.getElementById('inputProperty');
        inProp.style.left = `${propertyButtonX + 15}px`;
        inProp.style.top = `${propertyButtonY}px`;

        // Whole-abacus reset button: see positionResetButton().
        positionResetButton();
        markFade(document.getElementById('abacusResetBtn'));
    }

    // Position (and show) the reset button centred under the title. Split out so
    // the intro can display it while the rest of the UI stays hidden.
    function positionResetButton() {
        const titleEl = document.getElementById('abacusTitle');
        const resetEl = document.getElementById('abacusResetBtn');
        if (titleEl && resetEl) {
            // The title uses translate(-50%,-50%), so its CSS `left` IS the
            // visual centre-x; read it from computed style rather than offsetLeft
            // (the rendered left edge). Sit the button just below the title.
            const titleCenterX = parseFloat(getComputedStyle(titleEl).left) || centerX;
            const halfH = titleEl.offsetHeight / 2;
            resetEl.style.left = `${titleCenterX}px`;
            resetEl.style.top = `${centerY + halfH + 20}px`;
            resetEl.style.display = 'block';
        }
    }

    // =====================================================================
    // ADD OPERATIONS
    // =====================================================================
    function addNewFeature(sector, name) {
        if (!name.trim()) return;
        const newItem = { name: name.trim(), values: {} };
        properties.forEach(p => { newItem.values[p] = ""; });
        if (sector === 1) materials.push(newItem);
        else if (sector === 2) semiProcessed.push(newItem);
        else if (sector === 3) furniture.push(newItem);
        saveUserData();
        document.getElementById(`inputSector${sector}`).style.display = 'none';
        overlay.style.display = 'none';
        activeSector = null;
        drawGrid();
        positionUIElements();
    }

    function addNewProperty(name) {
        if (!name.trim()) return;
        const propName = name.trim();
        if (properties.includes(propName)) return;

        const isIncremental = document.getElementById('inputPropertyTypeToggle').checked;
        propertyType[propName] = isIncremental ? "incremental" : "neutral";

        properties.push(propName);
        materials.forEach(m => m.values[propName] = "");
        semiProcessed.forEach(m => m.values[propName] = "");
        furniture.forEach(m => m.values[propName] = "");
        saveUserData();

        document.getElementById('inputPropertyTypeToggle').checked = true;
        updateTypePreview();
        document.getElementById('inputProperty').style.display = 'none';
        overlay.style.display = 'none';
        activeSector = null;
        drawGrid();
        positionUIElements();

        openLevelNamePicker(propName, properties.length - 1);
    }

    // =====================================================================
    // PERSISTENCE (+ one-time migration from the pre-V6 keys)
    // =====================================================================
    const USER_DATA_KEY = 'abacus_user_data_v6';
    const USER_DATA_KEY_LEGACY = 'abacus_user_data';
    // Per-session flag: intro plays on the first init of a browser session.
    const INTRO_SEEN_KEY = 'abacus_intro_shown_v6';

    function saveUserData() {
        const userProps = properties.filter(c => !defaultPropertyNames.has(c));
        const userTypes = {}, userLevelNames = {}, userLetterMapping = {};
        for (const p of userProps) {
            if (propertyType[p] !== undefined) userTypes[p] = propertyType[p];
            if (levelNames[p] !== undefined) userLevelNames[p] = levelNames[p];
            if (letterMapping[p] !== undefined) userLetterMapping[p] = letterMapping[p];
        }
        // Value overrides on DEFAULT features. A default feature is never stored
        // wholesale (its name is filtered out below), so a bead assigned/changed on
        // one would otherwise be lost on reload. Diff each default feature's current
        // values against the frozen default snapshot and store only the deltas.
        // Keyed by category -> feature name -> { propertyName: value }.
        const valueOverrides = { material: {}, semiProcessed: {}, furniture: {} };
        function collectOverrides(arr, defaultNames, snapshot, bucket) {
            for (const m of arr) {
                if (!defaultNames.has(m.name)) continue; // user features stored whole
                const base = snapshot[m.name] || {};
                const delta = {};
                for (const p in m.values) {
                    if (String(m.values[p]) !== String(base[p] !== undefined ? base[p] : '')) {
                        delta[p] = m.values[p];
                    }
                }
                if (Object.keys(delta).length) bucket[m.name] = delta;
            }
        }
        collectOverrides(materials, defaultMaterialNames, defaultFeatureValues.material, valueOverrides.material);
        collectOverrides(semiProcessed, defaultSemiNames, defaultFeatureValues.semiProcessed, valueOverrides.semiProcessed);
        collectOverrides(furniture, defaultFurnitureNames, defaultFeatureValues.furniture, valueOverrides.furniture);

        const userData = {
            properties: userProps,
            propertyTypes: userTypes,
            levelNames: userLevelNames,
            letterMapping: userLetterMapping,
            materials: materials.filter(m => !defaultMaterialNames.has(m.name)),
            semiProcessed: semiProcessed.filter(m => !defaultSemiNames.has(m.name)),
            furniture: furniture.filter(m => !defaultFurnitureNames.has(m.name)),
            valueOverrides,
        };
        try { localStorage.setItem(USER_DATA_KEY, JSON.stringify(userData)); }
        catch (e) { console.warn('Could not save user data to localStorage:', e); }
    }

    function resetToDefaults() {
        try { localStorage.removeItem(USER_DATA_KEY); } catch (e) {}
        window.location.reload();
    }

    // =====================================================================
    // CROSSING HIT-DETECTION (feature line x property ring)
    // =====================================================================
    function findHoveredCrossing(mouseX, mouseY) {
        const g = geometry();
        const dx = mouseX - centerX;
        const dy = mouseY - centerY;
        const r = Math.sqrt(dx * dx + dy * dy);
        if (r < innerRadius - (dotRadius + 4)) return null;

        // Nearest property ring.
        let bestProp = -1, bestPropDist = Infinity;
        for (let i = 0; i < properties.length; i++) {
            const propR = innerRadius + i * circleSpacing;
            const d = Math.abs(r - propR);
            if (d < bestPropDist) { bestPropDist = d; bestProp = i; }
        }
        if (bestPropDist > dotRadius + 4) return null;

        // Nearest feature line by angle.
        const theta = Math.atan2(dy, dx);
        let best = null, bestAng = Infinity;
        for (const cat of FEATURE_CATEGORIES) {
            const arr = cat.arr();
            for (let i = 0; i < arr.length; i++) {
                const a = featureAngle(cat.type, i, g);
                let da = a - theta;
                while (da > Math.PI) da -= 2 * Math.PI;
                while (da < -Math.PI) da += 2 * Math.PI;
                da = Math.abs(da);
                if (da < bestAng) { bestAng = da; best = { type: cat.type, index: i, angle: a, item: arr[i] }; }
            }
        }
        if (!best) return null;
        const angularTol = (dotRadius + 4) / Math.max(r, 1);
        if (bestAng > angularTol) return null;

        const propName = properties[bestProp];
        const item = best.item;
        if (!item) return null;
        const value = (item.values && item.values[propName] !== undefined) ? String(item.values[propName]) : '';
        const propRadius = innerRadius + bestProp * circleSpacing;
        return {
            type: best.type,
            featureIndex: best.index,
            featureName: item.name,
            propertyIndex: bestProp,
            propertyName: propName,
            angle: best.angle,
            radius: propRadius,
            x: centerX + propRadius * Math.cos(best.angle),
            y: centerY + propRadius * Math.sin(best.angle),
            value: value,
            hasValue: value !== '',
        };
    }

    // =====================================================================
    // HIT-TEST: is a point inside a text element?
    // =====================================================================
    function isPointInTextElement(x, y, element) {
        const cos = Math.cos(element.angle);
        const sin = Math.sin(element.angle);
        const localX = (x - element.x) * cos + (y - element.y) * sin;
        const localY = -(x - element.x) * sin + (y - element.y) * cos;
        const padX = 4, padY = 2;
        return localX >= -padX && localX <= element.width + padX
            && localY >= -6 - padY && localY <= 6 + padY;
    }

    // =====================================================================
    // USER-ADDED MANAGEMENT: hover action buttons, delete/reset, confirm modal
    // =====================================================================
    function isUserProperty(name) { return !defaultPropertyNames.has(name); }
    function isUserFeature(type, name) { return !defaultNameSet(type).has(name); }

    // Suppress fade-out while the cursor is over an action-button group.
    let actionsHovered = false;

    // Geometry constants for the feature-hover buttons / corridor hit zone.
    const OUTERMOST_INNER_R = innerRadius - circleSpacing;
    const FEATURE_BTN_RADIUS = OUTERMOST_INNER_R - 10;   // just inside the outer ring
    const FEATURE_BTN_PERP_OFFSET = 14;                  // half the tangential gap between the two

    function updateActionButtons() {
        const propEl = document.getElementById('propertyActions');
        const featEl = document.getElementById('featureActions');
        propEl.style.display = 'none';
        featEl.style.display = 'none';

        // Property: horizontal pair just left of the property text.
        if (hoveredProperty !== null) {
            const name = properties[hoveredProperty];
            if (isUserProperty(name)) {
                const g = geometry();
                const y = centerY - (innerRadius + hoveredProperty * circleSpacing);
                const buttonGroupWidth = 48;
                const x = g.textAnchorX + textPadding - buttonGroupWidth - 4;
                propEl.style.left = x + 'px';
                propEl.style.top = (y - 11) + 'px';
                propEl.style.transform = 'rotate(0deg)';
                propEl.dataset.target = name;
                propEl.style.display = 'inline-block';
            }
        }

        // Feature: two upright buttons on opposite sides of the feature line.
        if (hoveredFeature !== null) {
            const type = hoveredFeature.type;
            const item = categoryArray(type)[hoveredFeature.index];
            if (item && isUserFeature(type, item.name)) {
                const angle = hoveredFeature.angle;
                const cx = centerX + FEATURE_BTN_RADIUS * Math.cos(angle);
                const cy = centerY + FEATURE_BTN_RADIUS * Math.sin(angle);
                const tx = -Math.sin(angle), ty = Math.cos(angle);
                const HALF = 10;

                featEl.style.left = '0px';
                featEl.style.top = '0px';
                featEl.style.transform = 'none';
                featEl.dataset.target = JSON.stringify({ type, name: item.name });
                featEl.style.display = 'block';

                const btns = featEl.querySelectorAll('.user-action-btn');
                btns[0].style.position = 'absolute';
                btns[0].style.margin = '0';
                btns[0].style.left = (cx + FEATURE_BTN_PERP_OFFSET * tx - HALF) + 'px';
                btns[0].style.top  = (cy + FEATURE_BTN_PERP_OFFSET * ty - HALF) + 'px';
                btns[1].style.position = 'absolute';
                btns[1].style.margin = '0';
                btns[1].style.left = (cx - FEATURE_BTN_PERP_OFFSET * tx - HALF) + 'px';
                btns[1].style.top  = (cy - FEATURE_BTN_PERP_OFFSET * ty - HALF) + 'px';
            }
        }
    }

    function showConfirm(message, onOk) {
        const modal = document.getElementById('confirmModal');
        document.getElementById('confirmMessage').textContent = message;
        modal.style.display = 'flex';
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');
        const close = () => { modal.style.display = 'none'; };
        okBtn.onclick = () => { close(); onOk(); };
        cancelBtn.onclick = close;
    }

    function deleteProperty(name) {
        if (!isUserProperty(name)) return;
        const idx = properties.indexOf(name);
        if (idx < 0) return;
        properties.splice(idx, 1);
        delete propertyType[name];
        delete levelNames[name];
        delete letterMapping[name];
        delete propertyHues[name];
        savePropertyHues();
        materials.forEach(m => delete m.values[name]);
        semiProcessed.forEach(m => delete m.values[name]);
        furniture.forEach(m => delete m.values[name]);
    }

    function deleteFeature(type, name) {
        if (!isUserFeature(type, name)) return;
        if (type === 'material') materials = materials.filter(m => m.name !== name);
        else if (type === 'semiProcessed') semiProcessed = semiProcessed.filter(m => m.name !== name);
        else if (type === 'furniture') furniture = furniture.filter(m => m.name !== name);
    }

    function resetUserProperties() {
        properties.filter(c => !defaultPropertyNames.has(c)).forEach(deleteProperty);
    }
    function resetUserFeatures() {
        materials = materials.filter(m => defaultMaterialNames.has(m.name));
        semiProcessed = semiProcessed.filter(m => defaultSemiNames.has(m.name));
        furniture = furniture.filter(m => defaultFurnitureNames.has(m.name));
    }

    // True if any bead anywhere differs from its default (snapshot for default
    // features; non-empty for user-added features). Drives whether the picker's
    // reset-all-beads button is offered.
    function isAnyBeadModified() {
        for (const cat of FEATURE_CATEGORIES) {
            const dNames = defaultNameSet(cat.type);
            const snapAll = defaultFeatureValues[cat.type];
            for (const m of cat.arr()) {
                const userFeat = !dNames.has(m.name);
                for (const p of properties) {
                    const cur = String(m.values[p] || '');
                    if (userFeat) { if (cur !== '') return true; }
                    else {
                        const snap = snapAll[m.name] || {};
                        const def = snap[p] !== undefined ? String(snap[p]) : '';
                        if (cur !== def) return true;
                    }
                }
            }
        }
        return false;
    }

    // Reset all modified level beads to default (issue 3). "Default" = the frozen
    // snapshot value for default features (empty if the property didn't exist at
    // init), and empty for user-added features. Restricted to properties that
    // still exist so we don't resurrect values for deleted ones.
    function resetAllBeads() {
        const restore = (arr, defaultNames, snapshot) => {
            for (const m of arr) {
                for (const p of properties) {
                    let def = '';
                    if (defaultNames.has(m.name)) {
                        const base = snapshot[m.name];
                        if (base && base[p] !== undefined) def = base[p];
                    }
                    m.values[p] = def;
                }
            }
        };
        restore(materials, defaultMaterialNames, defaultFeatureValues.material);
        restore(semiProcessed, defaultSemiNames, defaultFeatureValues.semiProcessed);
        restore(furniture, defaultFurnitureNames, defaultFeatureValues.furniture);
    }

    // Reset a single bead to default (issue 3 delete-bead).
    function resetOneBead(type, featureName, propertyName) {
        const arr = categoryArray(type);
        const m = arr.find(x => x.name === featureName);
        if (!m) return;
        let def = '';
        const defaultNames = defaultNameSet(type);
        if (defaultNames.has(featureName)) {
            const snap = defaultFeatureValues[type][featureName];
            if (snap && snap[propertyName] !== undefined) def = snap[propertyName];
        }
        m.values[propertyName] = def;
    }

    // Reset the whole abacus (issue 3): all user features + properties removed,
    // all modified beads reset. Beads reset first (needs the full property list),
    // then user properties/features are stripped.
    function resetWholeAbacus() {
        resetAllBeads();
        resetUserProperties();
        resetUserFeatures();
    }

    // Common cleanup after any delete/reset.
    function postChange() {
        saveUserData();
        hoveredProperty = null;
        hoveredFeature = null;
        hoveredLevelValue = null;
        hoveredGroup = null;
        hoveredElement = null;
        focusedCrossing = null;
        hoveredCrossing = null;
        mainFade.start(0);   // settle handler will finish clearing once at 0
        intersectionFade.start(0);
        actionsHovered = false;
        updateActionButtons();
        drawGrid();
        positionUIElements();
    }

    document.getElementById('propertyActions').addEventListener('click', (e) => {
        const btn = e.target.closest('.user-action-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        const targetName = document.getElementById('propertyActions').dataset.target;
        if (!targetName) return;
        if (action === 'delete-property') {
            showConfirm(`The selected property, "${getDisplayName(targetName)}", will be deleted.`,
                () => { deleteProperty(targetName); postChange(); });
        } else if (action === 'reset-property') {
            showConfirm('All added properties will be deleted.',
                () => { resetUserProperties(); postChange(); });
        }
    });

    document.getElementById('featureActions').addEventListener('click', (e) => {
        const btn = e.target.closest('.user-action-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        let target;
        try { target = JSON.parse(document.getElementById('featureActions').dataset.target || '{}'); }
        catch (err) { return; }
        if (!target.type || !target.name) return;
        if (action === 'delete-feature') {
            showConfirm(`The selected feature, "${target.name}", will be deleted.`,
                () => { deleteFeature(target.type, target.name); postChange(); });
        } else if (action === 'reset-feature') {
            showConfirm('All added features will be deleted.',
                () => { resetUserFeatures(); postChange(); });
        }
    });

    // Whole-abacus reset (center title button): remove all user features +
    // properties and reset all modified beads.
    document.getElementById('abacusResetBtn').addEventListener('click', () => {
        if (introState.active) return;
        showConfirm(
            'All added properties and features and modified property levels will be deleted and the abacus will be reset to its original form.',
            () => {
                resetWholeAbacus();
                saveUserData();
                // Clear hover/focus state without the normal redraw, then replay
                // the intro from a blank canvas.
                hoveredProperty = null; hoveredFeature = null; hoveredLevelValue = null;
                hoveredGroup = null; hoveredElement = null; focusedCrossing = null;
                hoveredCrossing = null; actionsHovered = false;
                updateActionButtons();
                startIntro();
            }
        );
    });

    ['propertyActions', 'featureActions'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('mouseenter', () => { actionsHovered = true; });
        el.addEventListener('mouseleave', (e) => {
            actionsHovered = false;
            if (e.relatedTarget !== canvas) mainFade.start(0);
        });
    });

    // =====================================================================
    // ADD-BUTTON + INPUT LISTENERS
    // =====================================================================
    function closeAllInputs() {
        for (let i = 1; i <= 3; i++) document.getElementById(`inputSector${i}`).style.display = 'none';
        document.getElementById('inputProperty').style.display = 'none';
        overlay.style.display = 'none';
        activeSector = null;

    [1, 2, 3].forEach(n => {
        document.getElementById(`addSector${n}`).addEventListener('click', () => {
            closeAllInputs();
            document.getElementById(`inputSector${n}`).style.display = 'block';
            document.getElementById(`inputSector${n}Text`).focus();
            overlay.style.display = 'block';
            activeSector = n;
        });
        document.getElementById(`inputSector${n}Text`).addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { addNewFeature(n, e.target.value); e.target.value = ''; }
        });
    });

    document.getElementById('addProperty').addEventListener('click', () => {
        closeAllInputs();
        document.getElementById('inputProperty').style.display = 'block';
        document.getElementById('inputPropertyText').focus();

    function updateTypePreview() {
        const toggle = document.getElementById('inputPropertyTypeToggle');
        const preview = document.getElementById('typePreview');
        if (!toggle || !preview) return;
        preview.classList.remove('incremental', 'neutral');
        preview.classList.add(toggle.checked ? 'incremental' : 'neutral');
    }
    document.getElementById('inputPropertyTypeToggle').addEventListener('change', updateTypePreview);
    updateTypePreview();

    document.getElementById('inputPropertyText').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { addNewProperty(e.target.value); e.target.value = ''; }
    });

    document.addEventListener('click', (e) => {
        if (activeSector !== null) {
            const inputId = activeSector === 'property' ? 'inputProperty' : `inputSector${activeSector}`;
            const buttonId = activeSector === 'property' ? 'addProperty' : `addSector${activeSector}`;
            const inputContainer = document.getElementById(inputId);
            const button = document.getElementById(buttonId);
            if (!inputContainer.contains(e.target) && !button.contains(e.target)) closeAllInputs();
        }
    });

    // =====================================================================
    // HOVER (mousemove)
    // =====================================================================
    canvas.addEventListener('mousemove', (e) => {
        if (introState.active) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        let newHoverElement = null;
        let newHoverFeature = null;
        let newHoverProperty = null;
        let newHoverLevelValue = null;
        let newHoverGroup = null;

        for (const element of textElements) {
            if (isPointInTextElement(mouseX, mouseY, element)) {
                newHoverElement = element;
                if (element.type === 'material' || element.type === 'semiProcessed' || element.type === 'furniture') {
                    newHoverFeature = element;
                } else if (element.type === 'characteristic') {
                    newHoverProperty = element.index;
                    newHoverGroup = groupForIndex(element.index);
                } else if (element.type === 'level') {
                    newHoverProperty = element.index;
                    newHoverLevelValue = element.value;
                    newHoverGroup = groupForIndex(element.index);
                } else if (element.type === 'group') {
                    newHoverGroup = propertyGroups.find(g => g.name === element.groupName) || null;
                }
                break;
            }
        }

        // Radial corridor: keep a user-added feature hovered while the cursor
        // travels along its line toward the tangential action buttons.
        if (!newHoverFeature && hoveredFeature) {
            const h = hoveredFeature;
            const item = categoryArray(h.type)[h.index];
            if (item && isUserFeature(h.type, item.name)) {
                const dx = mouseX - centerX, dy = mouseY - centerY;
                const along = dx * Math.cos(h.angle) + dy * Math.sin(h.angle);
                const perp  = -dx * Math.sin(h.angle) + dy * Math.cos(h.angle);
                const corridorInner = h.textStartRadius - 4;
                const corridorOuter = FEATURE_BTN_RADIUS + 14;
                if (along >= corridorInner && along <= corridorOuter && Math.abs(perp) <= FEATURE_BTN_PERP_OFFSET + 14) {
                    newHoverElement = hoveredElement;
                    newHoverFeature = h;
                }
            }
        }

        const hasNewHover = newHoverFeature !== null || newHoverProperty !== null || newHoverGroup !== null;

        if (hasNewHover) {
            hoveredElement = newHoverElement;
            hoveredFeature = newHoverFeature;
            hoveredProperty = newHoverProperty;
            hoveredLevelValue = newHoverLevelValue;
            hoveredGroup = newHoverGroup;
            updateActionButtons();
            const wasIdle = mainFade.value === 0 && mainFade.target === 0;
            mainFade.start(1);
            // If already fully faded-in and no animation is scheduled, redraw so the
            // highlight swaps to the new element.
            if (!wasIdle && mainFade.value === 1) drawGrid();
        } else {
            // Don't clear hovered* here; the fade settle handler clears at value 0.
            mainFade.start(0);
        }

        // Crossing handling. Empty -> placeholder + its own fade (clickable).
        // Filled -> focus mode (main fade dims; drawFocusedCrossing redraws).
        const newCrossing = findHoveredCrossing(mouseX, mouseY);
        if (newCrossing && !newCrossing.hasValue) {
            const same = hoveredCrossing &&
                hoveredCrossing.type === newCrossing.type &&
                hoveredCrossing.featureIndex === newCrossing.featureIndex &&
                hoveredCrossing.propertyIndex === newCrossing.propertyIndex;
            if (!same) { hoveredCrossing = newCrossing; drawGrid(); }
            intersectionFade.start(1);
            if (focusedCrossing) { focusedCrossing = null; cancelLongPress(); drawGrid(); }
        } else if (newCrossing && newCrossing.hasValue) {
            // A filled bead is under the cursor: focus mode owns the hover this
            // frame. Any feature/property text hover set by the block above (e.g.
            // the name we just moved off of, or the corridor keeping the old
            // feature alive) is stale relative to the bead and must be dropped —
            // otherwise drawHoverEffects' focus early-return leaves the old
            // feature drawn while the focused bead renders, blanking one of them.
            hoveredFeature = null;
            hoveredProperty = null;
            hoveredLevelValue = null;
            hoveredElement = null;
            updateActionButtons();
            const same = focusedCrossing &&
                focusedCrossing.type === newCrossing.type &&
                focusedCrossing.featureIndex === newCrossing.featureIndex &&
                focusedCrossing.propertyIndex === newCrossing.propertyIndex;
            if (!same) { focusedCrossing = newCrossing; cancelLongPress(); drawGrid(); }
            const fg = groupForProperty(newCrossing.propertyName);
            if (fg !== hoveredGroup) { hoveredGroup = fg; drawGrid(); }
            mainFade.start(1);
            intersectionFade.start(0);
            if (mainFade.value === 1) drawGrid();
        } else {
            intersectionFade.start(0);
            if (focusedCrossing) {
                // A filled crossing was focused last frame but the cursor is no
                // longer on any crossing. If the cursor has instead landed on a
                // different hover element (a feature name, property, group...),
                // the focus is stale: clear it now so drawHoverEffects doesn't
                // early-return on it (which left the old bead's feature drawn and
                // the newly-hovered element blank/white). Then redraw so the new
                // highlight takes over immediately.
                focusedCrossing = null;
                cancelLongPress();
                if (!hasNewHover) mainFade.start(0);
                else drawGrid();
            }
            if (!hasNewHover && focusedCrossing === null && hoveredGroup) hoveredGroup = null;
        }
    });

    canvas.addEventListener('mouseleave', (e) => {
        if (introState.active) return;
        const r = e.relatedTarget;
        if (r && r.closest && (r.closest('#propertyActions') || r.closest('#featureActions'))) return;
        mainFade.start(0);
        intersectionFade.start(0);
        cancelLongPress();
    });

    // =====================================================================
    // LEVEL PICKER (assign / change a level at a crossing)
    // =====================================================================
    function openLevelPicker(crossing) {
        const picker   = document.getElementById('levelPicker');
        const pOverlay = document.getElementById('levelPickerOverlay');
        const feature  = document.getElementById('pickerFeature');
        const property = document.getElementById('pickerProperty');
        const circles  = document.getElementById('pickerCircles');
        const status   = document.getElementById('pickerStatus');

        feature.textContent  = crossing.featureName;
        property.textContent = getDisplayName(crossing.propertyName);

        circles.innerHTML = '';
        const isNeutral = getPropertyType(crossing.propertyName) === 'neutral';
        const levels = levelNames[crossing.propertyName] || ['', '', ''];
        const mapping = letterMapping[crossing.propertyName] || {};
        for (let i = 0; i < levels.length; i++) {
            const v = String(i);
            const btn = document.createElement('button');
            btn.className = 'level-circle';
            btn.dataset.level = v;
            if (isNeutral) {
                btn.style.background = '#ffffff';
                btn.textContent = (mapping[v] !== undefined) ? mapping[v] : v;
            } else {
                const col = getColorForValue(crossing.propertyName, v);
                btn.style.background = col || '#ffffff';
                btn.textContent = '';
            }
            const levelName = levels[i] || ('level ' + v);
            btn.addEventListener('mouseenter', () => { status.textContent = levelName; });
            btn.addEventListener('mouseleave', () => { status.textContent = 'select level'; });
            btn.addEventListener('click', () => assignLevel(crossing, v));
            circles.appendChild(btn);
        }

        // Remove-level (slash) button: empties the bead. Offered whenever there is
        // a level to remove (current value non-empty) — including default beads,
        // so a default property level can be removed. After removal the bead reads
        // as modified, so the top-right delete/reset buttons then appear to undo it.
        if (String(crossing.value || '') !== '') {
            const removeBtn = document.createElement('button');
            removeBtn.className = 'level-circle level-reset';
            removeBtn.style.background = '#ffffff';
            removeBtn.innerHTML =
                '<svg viewBox="0 0 24 24" width="14" height="14" stroke="#605a5a" ' +
                'stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            removeBtn.addEventListener('mouseenter', () => { status.textContent = 'remove level'; });
            removeBtn.addEventListener('mouseleave', () => { status.textContent = 'select level'; });
            removeBtn.addEventListener('click', () => assignLevel(crossing, ''));
            circles.appendChild(removeBtn);
        }

        // Top-right actions (reset-all-beads / delete-this-bead) appear only when
        // this bead is user-modified: either the feature is user-added, or the
        // current value differs from the default snapshot for a default feature.
        const actionsEl = document.getElementById('pickerActions');
        const dNames = defaultNameSet(crossing.type);
        const isUserFeat = !dNames.has(crossing.featureName);
        let beadModified;
        if (isUserFeat) {
            beadModified = String(crossing.value || '') !== '';
        } else {
            const snap = defaultFeatureValues[crossing.type][crossing.featureName] || {};
            const def = snap[crossing.propertyName] !== undefined ? String(snap[crossing.propertyName]) : '';
            beadModified = String(crossing.value || '') !== def;
        }
        // Reset-all is offered whenever ANY bead is modified anywhere; delete-this
        // only when this specific bead is modified.
        const anyBeadModified = isAnyBeadModified();
        if (beadModified || anyBeadModified) {
            actionsEl.style.display = 'flex';
            document.getElementById('pickerDeleteBead').style.display = beadModified ? 'inline-flex' : 'none';
            document.getElementById('pickerResetBeads').style.display = anyBeadModified ? 'inline-flex' : 'none';
        } else {
            actionsEl.style.display = 'none';
        }
        const deleteBeadBtn = document.getElementById('pickerDeleteBead');
        const resetBeadsBtn = document.getElementById('pickerResetBeads');
        deleteBeadBtn.onmouseenter = () => { status.textContent = 'reset this level'; };
        deleteBeadBtn.onmouseleave = () => { status.textContent = 'select level'; };
        resetBeadsBtn.onmouseenter = () => { status.textContent = 'reset all levels'; };
        resetBeadsBtn.onmouseleave = () => { status.textContent = 'select level'; };
        deleteBeadBtn.onclick = () => {
            showConfirm(
                `The property level "${getDisplayName(crossing.propertyName)}" of "${crossing.featureName}" will be reset to default.`,
                () => { resetOneBead(crossing.type, crossing.featureName, crossing.propertyName); saveUserData(); closeLevelPicker(); postChange(); }
            );
        };
        resetBeadsBtn.onclick = () => {
            showConfirm(
                'All modified property levels will be reset to default.',
                () => { resetAllBeads(); saveUserData(); closeLevelPicker(); postChange(); }
            );
        };

        status.textContent = 'select level';

        picker.style.display = 'block';
        const w = picker.offsetWidth, h = picker.offsetHeight;
        picker.style.left = (crossing.x - w / 2) + 'px';
        picker.style.top  = (crossing.y - h / 2) + 'px';

        pOverlay.style.display = 'block';
        void pOverlay.offsetWidth;
        pOverlay.classList.add('active');
        picker.classList.add('active');

        intersectionFade.start(0);
    }

    function closeLevelPicker() {
        const picker   = document.getElementById('levelPicker');
        const pOverlay = document.getElementById('levelPickerOverlay');
        pOverlay.classList.remove('active');
        picker.classList.remove('active');
        setTimeout(() => { pOverlay.style.display = 'none'; picker.style.display = 'none'; }, 200);
    }

    function assignLevel(crossing, value) {
        const item = categoryArray(crossing.type)[crossing.featureIndex];
        if (item) {
            if (!item.values) item.values = {};
            item.values[crossing.propertyName] = value;
            saveUserData();
            drawGrid();
        }
        closeLevelPicker();
    }
    document.getElementById('levelPickerOverlay').addEventListener('click', closeLevelPicker);

    // =====================================================================
    // LEVEL-NAME PICKER (name the three levels of a newly-created property)
    // =====================================================================
    function openLevelNamePicker(propName, propIndex) {
        const overlayEl = document.getElementById('levelNamePickerOverlay');
        const picker    = document.getElementById('levelNamePicker');
        const titleEl   = document.getElementById('levelNameTitle');
        const g = geometry();

        const y = centerY - (innerRadius + propIndex * circleSpacing);
        const levelCols = computeLevelColumns(g.textAnchorX);

        picker.querySelectorAll('.level-name-input').forEach(el => el.remove());

        titleEl.style.left = g.textAnchorX + 'px';
        titleEl.style.top  = (y - 28) + 'px';

        const inputs = [];
        for (let v = 0; v < levelCols.length; v++) {
            const col = levelCols[v];
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'level-name-input';
            input.placeholder = propName.toLowerCase() + v;
            input.dataset.level = v;
            input.style.left  = (col.labelX - 2) + 'px';
            input.style.top   = (y - 10) + 'px';
            input.style.width = Math.max(60, col.gapEnd - col.labelX) + 'px';
            input.addEventListener('input', (e) => {
                if (!levelNames[propName]) levelNames[propName] = ['', '', ''];
                levelNames[propName][v] = e.target.value;
                saveUserData();
                drawGrid();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (v < levelCols.length - 1) inputs[v + 1].focus();
                    else closeLevelNamePicker();
                } else if (e.key === 'Escape') {
                    closeLevelNamePicker();
                }
            });
            picker.appendChild(input);
            inputs.push(input);
        }

        overlayEl.style.display = 'block';
        picker.style.display = 'block';
        void overlayEl.offsetWidth;
        overlayEl.classList.add('active');
        picker.classList.add('active');
        inputs[0].focus();
    }

    function closeLevelNamePicker() {
        const overlayEl = document.getElementById('levelNamePickerOverlay');
        const picker    = document.getElementById('levelNamePicker');
        overlayEl.classList.remove('active');
        picker.classList.remove('active');
        setTimeout(() => {
            overlayEl.style.display = 'none';
            picker.style.display = 'none';
            picker.querySelectorAll('.level-name-input').forEach(el => el.remove());
        }, 200);
    }
    document.getElementById('levelNamePickerOverlay').addEventListener('click', closeLevelNamePicker);

    // =====================================================================
    // LONG-PRESS (filled bead -> reopen level picker after 2 s)
    // =====================================================================
    function tickLongPress() {
        if (!longPressTimer) { longPressFrameId = null; return; }
        drawGrid();
        longPressFrameId = requestAnimationFrame(tickLongPress);
    }
    function startLongPress(crossing) {
        cancelLongPress();
        longPressKey = `${crossing.type}/${crossing.featureIndex}/${crossing.propertyIndex}`;
        longPressStartTime = performance.now();
        longPressTimer = setTimeout(() => {
            if (focusedCrossing &&
                `${focusedCrossing.type}/${focusedCrossing.featureIndex}/${focusedCrossing.propertyIndex}` === longPressKey) {
                openLevelPicker(focusedCrossing);
            }
            longPressTimer = null;
            longPressKey = null;
            longPressStartTime = 0;
            if (longPressFrameId) { cancelAnimationFrame(longPressFrameId); longPressFrameId = null; }
            drawGrid();
        }, LONG_PRESS_MS);
        longPressFrameId = requestAnimationFrame(tickLongPress);
    }
    function cancelLongPress() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        if (longPressFrameId) { cancelAnimationFrame(longPressFrameId); longPressFrameId = null; }
        const wasActive = longPressKey !== null;
        longPressKey = null;
        longPressStartTime = 0;
        if (wasActive) drawGrid();
    }

    canvas.addEventListener('mousedown', () => { if (introState.active) return; if (focusedCrossing) startLongPress(focusedCrossing); });
    canvas.addEventListener('mouseup', () => { if (introState.active) return; cancelLongPress(); });
    canvas.addEventListener('click', () => {
        if (introState.active) return;
        if (hoveredCrossing && !hoveredCrossing.hasValue) openLevelPicker(hoveredCrossing);
    });

    // =====================================================================
    // INIT (defaults -> localStorage merge -> backfill -> render)
    // Includes one-time migration from the pre-V6 localStorage keys.
    // =====================================================================
    function migrateLegacyStorage() {
        // Copy old keys to the V6 keys once, if the V6 keys don't yet exist.
        // Old keys are left in place (non-destructive).
        try {
            if (localStorage.getItem(USER_DATA_KEY) === null) {
                const legacy = localStorage.getItem(USER_DATA_KEY_LEGACY);
                if (legacy !== null) localStorage.setItem(USER_DATA_KEY, legacy);
            }
        } catch (e) {}
        try {
            if (localStorage.getItem(PROPERTY_HUES_KEY) === null) {
                const legacyHues = localStorage.getItem(PROPERTY_HUES_KEY_LEGACY);
                if (legacyHues !== null) localStorage.setItem(PROPERTY_HUES_KEY, legacyHues);
            }
        } catch (e) {}
    }

    function init() {
        migrateLegacyStorage();

        const props = window.__abacusProperties;
        const feats = window.__abacusFeatures;
        if (!props || !feats) {
            throw new Error('Data files not loaded. Check that properties.js and features.js are next to abacus.html.');
        }

        // Defaults.
        for (const p of props.list) { properties.push(p); defaultPropertyNames.add(p); }
        Object.assign(propertyType, props.types || {});
        Object.assign(levelNames, props.levelNames || {});
        Object.assign(letterMapping, props.letterMapping || {});
        DEFAULT_PROPERTY_COUNT = props.list.length;
        propertyGroups = (props.groups || []).map(g => ({
            name: g.name,
            properties: Array.isArray(g.properties) ? g.properties.slice() : [],
        }));

        for (const m of (feats.materials || [])) { materials.push(m); defaultMaterialNames.add(m.name); }
        for (const m of (feats.semiProcessed || [])) { semiProcessed.push(m); defaultSemiNames.add(m.name); }
        for (const m of (feats.furniture || [])) { furniture.push(m); defaultFurnitureNames.add(m.name); }

        // Deep-copy each default feature's original values NOW, before user
        // overrides are applied, so the snapshot stays pristine for the diff.
        function snapshotValues(arr, bucket) {
            for (const m of arr) bucket[m.name] = Object.assign({}, m.values);
        }
        snapshotValues(materials, defaultFeatureValues.material);
        snapshotValues(semiProcessed, defaultFeatureValues.semiProcessed);
        snapshotValues(furniture, defaultFeatureValues.furniture);

        // Property hues.
        try { Object.assign(propertyHues, JSON.parse(localStorage.getItem(PROPERTY_HUES_KEY) || '{}')); }
        catch (e) {}

        // User additions.
        let userData = {};
        try { userData = JSON.parse(localStorage.getItem(USER_DATA_KEY) || '{}'); }
        catch (e) { console.warn('Corrupt user data in localStorage, ignoring:', e); }
        if (Array.isArray(userData.properties)) {
            for (const p of userData.properties) if (!properties.includes(p)) properties.push(p);
        }
        if (userData.propertyTypes) Object.assign(propertyType, userData.propertyTypes);
        if (userData.levelNames) Object.assign(levelNames, userData.levelNames);
        if (userData.letterMapping) Object.assign(letterMapping, userData.letterMapping);
        if (Array.isArray(userData.materials)) {
            for (const m of userData.materials) if (!materials.some(x => x.name === m.name)) materials.push(m);
        }
        if (Array.isArray(userData.semiProcessed)) {
            for (const m of userData.semiProcessed) if (!semiProcessed.some(x => x.name === m.name)) semiProcessed.push(m);
        }
        if (Array.isArray(userData.furniture)) {
            for (const m of userData.furniture) if (!furniture.some(x => x.name === m.name)) furniture.push(m);
        }

        // Re-apply persisted bead overrides onto default features (issue 1).
        if (userData.valueOverrides) {
            const applyOverrides = (arr, bucket) => {
                if (!bucket) return;
                for (const m of arr) {
                    const delta = bucket[m.name];
                    if (!delta) continue;
                    if (!m.values) m.values = {};
                    for (const p in delta) m.values[p] = delta[p];
                }
            };
            applyOverrides(materials, userData.valueOverrides.material);
            applyOverrides(semiProcessed, userData.valueOverrides.semiProcessed);
            applyOverrides(furniture, userData.valueOverrides.furniture);
        }

        // Backfill: every feature has an entry for every property.
        function backfill(arr) {
            for (const item of arr) {
                if (!item.values) item.values = {};
                for (const c of properties) if (item.values[c] === undefined) item.values[c] = "";
            }
        }
        backfill(materials);
        backfill(semiProcessed);
        backfill(furniture);

        // First load of this browser session -> play the intro; otherwise draw
        // normally. The flag lives in sessionStorage so it replays once per new
        // tab/session but not on in-session redraws. Reset also replays it (via
        // the reset handler calling startIntro directly).
        let firstThisSession = true;
        try { firstThisSession = sessionStorage.getItem(INTRO_SEEN_KEY) === null; } catch (e) {}
        if (firstThisSession) {
            try { sessionStorage.setItem(INTRO_SEEN_KEY, '1'); } catch (e) {}
            startIntro();
        } else {
            drawGrid();
            positionUIElements();
        }
    }

    try {
        init();
    } catch (err) {
        console.error('Init failed:', err);
        document.body.innerHTML =
            '<div style="font-family:Helvetica,Arial,sans-serif;max-width:600px;margin:60px auto;padding:20px;line-height:1.5;">' +
            '<h2 style="margin-top:0;">Could not initialize</h2>' +
            '<p>The abacus loads its default data from <code>properties.js</code> and <code>features.js</code>. Both files must sit next to <code>abacus.html</code> in the same folder.</p>' +
            '<p style="color:#888;font-size:12px;">Error: ' + (err && err.message ? err.message : err) + '</p>' +
            '</div>';
    }
    </script>

</body>
</html>
